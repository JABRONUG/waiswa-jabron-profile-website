  <h1>Contact Me</h1>
  <p>If you'd like to reach me, fill out this form or use the contact details below.</p>

  <form method="post" action="#">
    <label for="name">Full name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email address:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <input type="tel" id="phone" name="phone"><br><br>

      <option>Project collaboration</option>
      <option>Feedback</option>

    <label for="sub-no">No</label><br><br>

    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="6" cols="50" placeholder="Write your message here..."></textarea><br><br>

  </form>
